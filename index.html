<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Panel Pterodactyl</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body id="bodyTheme" class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4 md:p-6 transition-colors duration-300">
    <div class="max-w-xl mx-auto w-full mt-4 md:mt-10">
        <!-- Header & Navigasi -->
        <div class="flex justify-between items-center mb-6">
            <h1 id="brandTitle" class="text-xl md:text-2xl font-bold text-indigo-400">⚡ Order Panel Pterodactyl</h1>
            <button onclick="toggleAdminPanel()" class="text-xs md:text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
                ⚙️ Owner Panel
            </button>
        </div>

        <!-- Alert Notifikasi -->
        <div id="alertBox" class="hidden p-4 rounded-xl mb-4 text-sm border"></div>

        <!-- KOTAK FITUR OWNER (Hidden by default) -->
        <div id="adminPanel" class="hidden bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl mb-6">
            <h2 class="text-lg font-semibold border-b border-slate-700 pb-2 mb-4 text-indigo-400">🔧 Pengaturan Owner (API & Tampilan)</h2>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block mb-1 font-medium">Domain Panel</label>
                    <input type="text" id="cfgDomain" value="https://thepanel.putranasution.web.id" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1 font-medium">PLTA (App API Key)</label>
                        <input type="text" id="cfgPlta" value="ptla_ClbL66HqYT3U2BfcUsQwydERZiW5yzgSVjFxBBBRVZO" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">PLTC (Client API Key)</label>
                        <input type="text" id="cfgPltc" value="ptlc_ckhIlQlYIPOqVWxv9a5jH2b5Ov6Mkw3TCqGAFNLzJ3i" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block mb-1 font-medium">Egg ID</label>
                        <input type="text" id="cfgEgg" value="16" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">Nest ID</label>
                        <input type="text" id="cfgNest" value="5" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">Location</label>
                        <input type="text" id="cfgLoc" value="1" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block mb-1 font-medium">Token WA (Fonnte/Wagw)</label>
                        <input type="text" id="cfgWaToken" placeholder="Opsional" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                    </div>
                    <div>
                        <label class="block mb-1 font-medium">Target Nomor / Grup WA</label>
                        <input type="text" id="cfgWaTarget" placeholder="628xxxxxxxxxx" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                    </div>
                </div>
                <div>
                    <label class="block mb-1 font-medium">Tema Warna Web</label>
                    <select id="cfgTheme" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2">
                        <option value="indigo">Indigo (Default)</option>
                        <option value="blue">Blue Modern</option>
                        <option value="emerald">Emerald Green</option>
                        <option value="purple">Purple Neon</option>
                    </select>
                </div>
                <button onclick="saveOwnerConfig()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-2.5 rounded-xl transition mt-2">
                    Simpan Pengaturan Owner
                </button>
            </div>
        </div>

        <!-- KOTAK FORM PEMBELIAN USER -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <form id="orderForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Username Panel</label>
                    <input type="text" id="username" required placeholder="cth: putrahosting" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Pilih Spesifikasi Paket (1GB - 12GB)</label>
                    <select id="package" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500">
                        <option value="1|Panel 1GB / 1 vCPU|1024|100|2000">Panel 1GB / 1 vCPU - Rp 2.000</option>
                        <option value="2|Panel 2GB / 1 vCPU|2048|100|4000">Panel 2GB / 1 vCPU - Rp 4.000</option>
                        <option value="3|Panel 3GB / 2 vCPU|3072|200|6000">Panel 3GB / 2 vCPU - Rp 6.000</option>
                        <option value="4|Panel 4GB / 2 vCPU|4096|200|8000">Panel 4GB / 2 vCPU - Rp 8.000</option>
                        <option value="5|Panel 5GB / 3 vCPU|5120|300|10000">Panel 5GB / 3 vCPU - Rp 10.000</option>
                        <option value="6|Panel 6GB / 3 vCPU|6144|300|13000">Panel 6GB / 3 vCPU - Rp 13.000</option>
                        <option value="7|Panel 7GB / 4 vCPU|7168|400|16000">Panel 7GB / 4 vCPU - Rp 16.000</option>
                        <option value="8|Panel 8GB / 4 vCPU|8192|400|19000">Panel 8GB / 4 vCPU - Rp 19.000</option>
                        <option value="9|Panel 9GB / 5 vCPU|9216|500|22000">Panel 9GB / 5 vCPU - Rp 22.000</option>
                        <option value="10|Panel 10GB / 5 vCPU|10240|500|25000">Panel 10GB / 5 vCPU - Rp 25.000</option>
                        <option value="11|Panel 11GB / 6 vCPU|11264|600|28000">Panel 11GB / 6 vCPU - Rp 28.000</option>
                        <option value="12|Panel 12GB / Unlimited|12288|0|30000">Panel 12GB / Unlimited - Rp 30.000</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Pilih Durasi</label>
                    <select id="duration" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 focus:outline-none focus:border-indigo-500">
                        <option value="0.2|3 Hari">3 Hari (Hemat)</option>
                        <option value="0.5|7 Hari">7 Hari (1 Minggu)</option>
                        <option value="0.8|2 Minggu">2 Minggu</option>
                        <option value="1.0|1 Bulan">1 Bulan (Paling Laris)</option>
                    </select>
                </div>

                <p class="text-xs text-slate-400">*Tarif harga fleksibel mulai dari Rp 2.000 hingga Rp 30.000 sesuai spesifikasi RAM dan durasi.</p>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl transition duration-200">
                    Proses Pembelian & Buat Panel
                </button>
            </form>
        </div>
    </div>

    <footer class="text-center py-6 text-xs text-slate-500">
        Powered by Pterodactyl Panel &bull; The Panel Putranasution
    </footer>

    <script>
        // Load Config dari LocalStorage jika ada
        let config = JSON.parse(localStorage.getItem('owner_config')) || {
            domain: "https://thepanel.putranasution.web.id",
            plta: "ptla_ClbL66HqYT3U2BfcUsQwydERZiW5yzgSVjFxBBBRVZO",
            pltc: "ptlc_ckhIlQlYIPOqVWxv9a5jH2b5Ov6Mkw3TCqGAFNLzJ3i",
            egg: "16",
            nest: "5",
            loc: "1",
            waToken: "",
            waTarget: "",
            theme: "indigo"
        };

        applyConfigToUI();

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        function saveOwnerConfig() {
            config.domain = document.getElementById('cfgDomain').value;
            config.plta = document.getElementById('cfgPlta').value;
            config.pltc = document.getElementById('cfgPltc').value;
            config.egg = document.getElementById('cfgEgg').value;
            config.nest = document.getElementById('cfgNest').value;
            config.loc = document.getElementById('cfgLoc').value;
            config.waToken = document.getElementById('cfgWaToken').value;
            config.waTarget = document.getElementById('cfgWaTarget').value;
            config.theme = document.getElementById('cfgTheme').value;

            localStorage.setItem('owner_config', JSON.stringify(config));
            applyConfigToUI();
            toggleAdminPanel();
            showAlert("Pengaturan owner berhasil disimpan!", "success");
        }

        function applyConfigToUI() {
            document.getElementById('cfgDomain').value = config.domain;
            document.getElementById('cfgPlta').value = config.plta;
            document.getElementById('cfgPltc').value = config.pltc;
            document.getElementById('cfgEgg').value = config.egg;
            document.getElementById('cfgNest').value = config.nest;
            document.getElementById('cfgLoc').value = config.loc;
            document.getElementById('cfgWaToken').value = config.waToken;
            document.getElementById('cfgWaTarget').value = config.waTarget;
            document.getElementById('cfgTheme').value = config.theme;

            // Update Warna Tema Tombol/Judul
            const themeClass = config.theme;
            document.getElementById('brandTitle').className = `text-xl md:text-2xl font-bold text-${themeClass}-400`;
            document.getElementById('submitBtn').className = `w-full bg-${themeClass}-600 hover:bg-${themeClass}-500 font-semibold py-3 rounded-xl transition duration-200`;
        }

        function showAlert(message, type) {
            const box = document.getElementById('alertBox');
            box.classList.remove('hidden', 'bg-emerald-600/20', 'border-emerald-500', 'text-emerald-300', 'bg-rose-600/20', 'border-rose-500', 'text-rose-300');
            if(type === 'success') {
                box.classList.add('bg-emerald-600/20', 'border-emerald-500', 'text-emerald-300');
            } else {
                box.classList.add('bg-rose-600/20', 'border-rose-500', 'text-rose-300');
            }
            box.innerHTML = message;
        }

        // Proses Pembelian & Request API Pterodactyl langsung dari browser
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const pkgData = document.getElementById('package').value.split('|');
            const durData = document.getElementById('duration').value.split('|');

            const pkgName = pkgData[1];
            const ram = parseInt(pkgData[2]);
            const cpu = parseInt(pkgData[3]);
            const basePrice = parseInt(pkgData[4]);
            
            const multiplier = parseFloat(durData[0]);
            const durName = durData[1];
            const finalPrice = Math.ceil(basePrice * multiplier);

            const email = username + "@putranasution.web.id";
            const password = "Putra@" + Math.floor(1000 + Math.random() * 9000);
            const domain = config.domain.replace(/\/$/, "");

            showAlert(`Memproses pembuatan akun dan panel untuk <b>${username}</b>...`, 'success');

            try {
                // 1. Buat User Pterodactyl via API
                const userRes = await fetch(`${domain}/api/application/users`, {
                    method: 'POST',
                    headers: {
                        "Authorization": "Bearer " + config.plta,
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        username: username,
                        first_name: username,
                        last_name: "Client",
                        password: password
                    })
                });

                const userData = await userRes.json();
                if(!userRes.ok) throw new Error(userData.errors?.[0]?.detail || "Gagal membuat user Pterodactyl.");

                const userId = userData.attributes.id;

                // 2. Buat Server Pterodactyl via API
                const serverRes = await fetch(`${domain}/api/application/servers`, {
                    method: 'POST',
                    headers: {
                        "Authorization": "Bearer " + config.plta,
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify({
                        name: "Server-" + username,
                        user: userId,
                        egg: parseInt(config.egg),
                        nest: parseInt(config.nest),
                        docker_image: "ghcr.io/pterodactyl/yolks:nodejs_18",
                        startup: "npm start",
                        limits: { memory: ram, swap: 0, disk: ram, io: 500, cpu: cpu },
                        feature_limits: { databases: 1, backups: 1, allocations: 1 },
                        environment: { STARTUP: "npm start", USER_UPLOAD: "0", AUTO_UPDATE: "0" },
                        allocation: { default: parseInt(config.loc) },
                        start_on_completion: true
                    })
                });

                const serverData = await serverRes.json();
                if(!serverRes.ok) throw new Error(serverData.errors?.[0]?.detail || "Gagal membuat server.");

                // 3. Kirim Struk ke WhatsApp (jika token diisi)
                if(config.waToken && config.waTarget) {
                    let waText  = "📦 *STRUK PEMBELIAN PANEL BERHASIL* 📦\n\n";
                        waText += `👤 Username: ${username}\n`;
                        waText += `📧 Email: ${email}\n`;
                        waText += `🔑 Password: ${password}\n`;
                        waText += `🛠️ Paket: ${pkgName}\n`;
                        waText += `⏳ Durasi: ${durName}\n`;
                        waText += `💰 Total: Rp ${finalPrice.toLocaleString('id-ID')}\n`;
                        waText += `🔗 Link Panel: ${domain}\n\n`;
                        waText += `Terima kasih telah order!`;

                    await fetch('https://api.fonnte.com/send', {
                        method: 'POST',
                        headers: { "Authorization": config.waToken },
                        body: new URLSearchParams({ target: config.waTarget, message: waText })
                    }).catch(err => console.log("Gagal kirim WA:", err));
                }

                showAlert(`✨ <b>Sukses!</b> Panel berhasil dibuat.<br><b>Login:</b> ${domain}<br><b>User:</b> ${username} | <b>Pass:</b> ${password}<br>Struk telah dikirim ke WhatsApp.`, 'success');
                document.getElementById('orderForm').reset();

            } catch (err) {
                showAlert(`<b>Gagal:</b> ${err.message}`, 'error');
            }
        });
    </script>
</body>
</html>
